<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hishab Kitab</title>
  <meta name="description" content="Hishab Kitab — family expense tracker. Internal use only.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f6b63">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <script>
    // apply theme before paint
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('hk_prefs') || '{}'), t = p.theme || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="boot"><img class="logo-img" src="icons/icon-192.png" alt=""><div>Hishab Kitab</div></div>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
